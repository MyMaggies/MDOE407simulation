class Game{

    this.cv=canvas;this.ctx=canvas.getContext('2d');this.cfg=cfg;this.blockers=cfg.blockers;this.items=cfg.items;this.npcs=cfg.npcs;this.inter=cfg.interactables;

    this.keys={};this.paused=true;this.target=null;this.auto=null;this.time=0;this.near=null;this.stuck=0;this.vx=0;this.vy=0;
    this.bind();this.resize();window.addEventListener('resize',()=>this.resize());
    let last=performance.now();const loop=t=>{const dt=Math.min(.05,(t-last)/1000);last=t;this.time+=dt;if(!this.paused)this.update(dt);this.draw();requestAnimationFrame(loop)};requestAnimationFrame(loop)}
  resize(){const st=this.cv.parentElement;const aw=st.clientWidth-28,ah=st.clientHeight-28;const s=Math.min(aw/W,ah/H);const cw=Math.max(320,Math.floor(W*s)),ch=Math.floor(cw*H/W);
    const dpr=window.devicePixelRatio||1;this.cv.style.width=cw+'px';this.cv.style.height=ch+'px';this.cv.width=Math.round(cw*dpr);this.cv.height=Math.round(ch*dpr);this.k=this.cv.width/W}
  bind(){
    const typing=()=>/INPUT|TEXTAREA|SELECT/.test(document.activeElement&&document.activeElement.tagName);
    window.addEventListener('keydown',e=>{if(this.paused||typing())return;
      if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault();
      this.keys[e.code]=true;if(['KeyE','Space','Enter'].includes(e.code))this.interact()});
    window.addEventListener('keyup',e=>{this.keys[e.code]=false});
    window.addEventListener('blur',()=>{this.keys={}});
    this.cv.addEventListener('pointerdown',e=>{if(this.paused)return;const r=this.cv.getBoundingClientRect();const x=(e.clientX-r.left)/r.width*W,y=(e.clientY-r.top)/r.height*H;
      let hit=null,best=1e9;for(const i of this.inter){if(i.hidden)continue;const d=Math.hypot(x-(i.bx??i.x),y-(i.by??i.y)-0);if(d<46&&d<best){best=d;hit=i}}
      if(hit){if(this.near===hit)this.interact();else{this.target={x:hit.x,y:hit.y+4};this.auto=hit.id}}else{this.target={x,y};this.auto=null}});
    const pad=$('#pad');if(pad){const set=(d,on)=>{this['v'+d]=on};pad.querySelectorAll('button').forEach(b=>{const d=b.dataset.d;const dn=e=>{e.preventDefault();this.keys['pad'+d]=true};const up=e=>{e.preventDefault();this.keys['pad'+d]=false};b.addEventListener('pointerdown',dn);b.addEventListener('pointerup',up);b.addEventListener('pointerleave',up);b.addEventListener('pointercancel',up)})}
    const act=$('#act');if(act)act.addEventListener('pointerdown',e=>{e.preventDefault();if(!this.paused)this.interact()});
  }
  hits(x,y){const L=x-7,Rr=x+7,T=y-6,B=y;const b=this.cfg.bounds;if(L<b.x0||Rr>b.x1||T<b.y0||B>b.y1)return true;
    for(const r of this.blockers){if(r.off)continue;if(Rr>r.x&&L<r.x+r.w&&B>r.y&&T<r.y+r.h)return true}return false}
  update(dt){const p=this.p,k=this.keys;let dx=0,dy=0;
    if(k.ArrowLeft||k.KeyA||k.padL)dx--;if(k.ArrowRight||k.KeyD||k.padR)dx++;if(k.ArrowUp||k.KeyW||k.padU)dy--;if(k.ArrowDown||k.KeyS||k.padD)dy++;

    else if(this.target){const tx=this.target.x-p.x,ty=this.target.y-p.y,d=Math.hypot(tx,ty);if(d<5){this.target=null}else{dx=tx/d;dy=ty/d}}

      if(!this.hits(p.x+dx*sp,p.y))p.x+=dx*sp;if(!this.hits(p.x,p.y+dy*sp))p.y+=dy*sp;

    const p=this.p;list.push({y:p.y,draw:()=>{g.fillStyle='rgba(0,0,0,.28)';g.beginPath();g.ellipse(p.x,p.y-1,10,3.5,0,0,7);g.fill();g.drawImage(p.set[p.dir][p.step],p.x-16,p.y-46)}});
    list.sort((a,b)=>a.y-b.y);for(const l of list)l.draw();

    if(this.near&&!this.paused){const i=this.near;const bx=i.bx??i.x,by=(i.by??i.y)-20+Math.sin(t*5)*2;

  tag(g,x,y,label,mark){g.font='bold 10px monospace';const w=g.measureText(label).width+(mark?24:12);const bx=x-w/2;
    g.fillStyle='rgba(11,22,38,.88)';g.fillRect(bx,y-8,w,16);g.fillStyle='#5fc3d3';g.fillRect(bx,y+6,w,2);
    g.fillStyle='#fff';g.textBaseline='middle';g.textAlign='left';g.fillText(label,bx+6,y);

}

  why:'One metric (close rate) looks fine, but quota attainment has slid for six quarters in a row while discounting nearly tripled. Reading one number alone would have hidden a sustained pattern.'},
 {id:'theo',name:'Theo',role:'Sales Rep (new)',tenure:'5 months',metric:'Close rate (%)',target:30,vals:[12,16],team:[30,29],labels:['Q2','Q3'],
  rows:[['Proposals issued',[5,8]]],
  note:'Joined five months ago. Onboarding plans assume a three-quarter ramp-up before full targets apply.',
  ans:'insufficient',det:['Only two quarters of data, and still inside the normal ramp-up period','Theo’s close rate is 12% and 16%, far below target','The team average is 30%'],ok:0,
  hint:'How long has Theo been here, and what does the company expect of new joiners?',
  why:'Two quarters of data from someone still in their ramp-up period cannot show underperformance. Support and monitor, then judge when there is a fair amount of data.'},
 {id:'noor',name:'Noor',role:'Senior Sales Rep',tenure:'6 years',metric:'Close rate (%)',target:30,vals:[31,32,30,33,31,30,0],team:[30,31,30,31,30,31,30],
  rows:[['Proposals issued',[12,13,12,12,13,12,2]]],
  note:'Returned from six weeks of leave this quarter. Two proposals issued, both still in review: none has had time to close.',
  ans:'insufficient',det:['Noor’s close rate is 0% this quarter','Only two proposals this quarter, after six steady quarters and six weeks away','Noor has six years of experience'],ok:1,
  hint:'Check how many proposals sit behind that percentage.',
  why:'0% looks alarming, but it rests on two proposals and an absence. The six quarters before it were steady. A small sample cannot tell you anything yet: check again next quarter.'},
 {id:'ren',name:'Ren',role:'Sales Rep',tenure:'2 years',metric:'Close rate (%)',target:30,vals:[32,31,30,31,33,22],team:[30,30,31,30,30,30],labels:['Q4 LY','Q1','Q2','Q3','Q4 LY','Q3'],
  rows:[['Proposals issued',[12,13,12,13,12,12]]],
  note:'No known changes to Ren’s territory, products or process. Nobody has spoken to Ren about it yet.',
  ans:'insufficient',det:['Ren’s close rate dropped 11 points','The team average is on target','One quarter below target, and no known cause yet'],ok:2,
  hint:'What do you actually know about why? Can you yet tell an isolated blip from the start of a trend?',
  why:'One weak quarter after a strong run is not sustained, but it is not safely “isolated” either, because you do not know why. Look at next quarter’s numbers and ask Ren what has changed before drawing a conclusion.'}
];
CASES.forEach(c=>{c.labels=QL.slice(-c.vals.length)});
const LOOK={mira:LOOKS.mira,kit:LOOKS.kit,dana:LOOKS.dana,theo:LOOKS.theo,noor:LOOKS.noor,ren:LOOKS.ren};
const state={};CASES.forEach(c=>state[c.id]={status:'todo',wrong:0,first:null,last:null});
const done=()=>CASES.filter(c=>state[c.id].status==='ok').length;

/* ---- room ---- */
const room=buildRoom({floorRegions:[{x:0,y:96,w:960,h:448,base:'#7f8ca3',seed:3}],windows:[{x:40,w:192},{x:640,w:160}],sign:{x:338,w:244}});
{const g=room.getContext('2d');g.drawImage(wallWindow(192,72,3),40,12);g.drawImage(wallWindow(160,72,9),640,12);
}
const items=[],blockers=[],npcs=[],inter=[];
const deskImg=propDesk(),chairImg=propChair();
const xs=[96,320,544],tops=[132,292],order=['mira','kit','dana','theo','noor','ren'];
order.forEach((id,i)=>{const dx=xs[i%3],dt=tops[(i/3)|0],cx=dx+48,c=CASES.find(k=>k.id===id);
  items.push({img:chairImg,x:cx-18,y:dt-14,sort:dt+20});
  items.push({img:deskImg,x:dx,y:dt,sort:dt+56});
  blockers.push({x:dx-4,y:dt-6,w:104,h:62});
  const n={id,x:cx,y:dt+26,sort:dt+26,noShadow:true,set:charSet(LOOK[id]),label:c.name,tagY:dt-30,mark:'todo',ph:i*.7,dir:'down'};npcs.push(n);
  inter.push({id,x:cx,y:dt+76,r:58,bx:cx,by:dt+44,prompt:'Review '+c.name+'’s scorecard'})});
const plantI=propPlant(),cool=propCooler(),ped=propPedestal(),sofa=propSofa(),cab=propCabinet();
[[6,452],[906,452],[6,106]].forEach(([x,y])=>{items.push({img:plantI,x,y,sort:y+64,shadow:{x:x+20,y:y+62,rx:13,ry:4}});blockers.push({x:x+8,y:y+48,w:24,h:14})});
items.push({img:cool,x:792,y:296,sort:360,shadow:{x:808,y:358,rx:13,ry:4}});blockers.push({x:794,y:334,w:28,h:26});
items.push({img:ped,x:708,y:150,sort:238,shadow:{x:732,y:236,rx:22,ry:5}});blockers.push({x:712,y:206,w:40,h:32});
items.push({img:sofa,x:716,y:448,sort:500,shadow:{x:764,y:498,rx:46,ry:5}});blockers.push({x:716,y:462,w:96,h:36});
const doorShut=propDoor(false),doorOpen=propDoor(true);const door={img:doorShut,x:832,y:0,sort:60};items.push(door);
inter.push({id:'door',x:864,y:134,r:46,bx:864,by:120,prompt:'Case-File Room',hidden:false});
/* decorative caption on pedestal */
function overlay(g){g.font='bold 9px monospace';g.fillStyle='rgba(11,22,38,.85)';g.fillRect(698,244,68,14);g.fillStyle='#7fe0ee';g.textAlign='center';g.textBaseline='middle';g.fillText('LUMERA AURA',732,251);g.textAlign='left'}

window.G=new Game($('#cv'),{room,items,blockers,npcs,interactables:inter,start:{x:480,y:470},bounds:{x0:8,x1:952,y0:108,y1:536},overlay,
  onInteract:id=>{id==='door'?openDoor():openCase(id)}});

/* ---- HUD ---- */
function hud(){$('#prog').textContent='Scorecards reviewed: '+done()+' / '+CASES.length;
  npcs.forEach(n=>{const s=state[n.id];n.mark=s.status==='ok'?'ok':s.wrong?'retry':'todo'});
  if(done()===CASES.length&&door.img!==doorOpen){door.img=doorOpen}}
hud();

/* ---- chart ---- */
function chart(c){const n=c.vals.length,w=600,h=230,pl=44,pr=14,pt=26,pb=38;const mx=Math.max(...c.vals,...c.team,c.target)*1.18;const bw=(w-pl-pr)/n;const y=v=>pt+(h-pt-pb)*(1-v/mx);
  let s=`<svg viewBox="0 0 ${w} ${h}" style="width:100%;max-width:620px;display:block" role="img" aria-label="${esc(c.metric)} by quarter for ${c.name}: ${c.vals.join(', ')}. Team average: ${c.team.join(', ')}. Target ${c.target}.">`;
  s+=`<rect width="${w}" height="${h}" fill="#0f1c30" rx="6"/>`;
  for(let i=0;i<=4;i++){const v=mx*i/4,yy=y(v);s+=`<line x1="${pl}" x2="${w-pr}" y1="${yy}" y2="${yy}" stroke="#25405f" stroke-width="1"/><text x="${pl-6}" y="${yy+4}" text-anchor="end" font-size="11" fill="#8fa6c4">${Math.round(v)}</text>`}
  c.vals.forEach((v,i)=>{const x=pl+i*bw+bw*.2,bwd=bw*.6;s+=`<rect x="${x}" y="${y(v)}" width="${bwd}" height="${Math.max(1,y(0)-y(v))}" fill="#2A7F8E"/><rect x="${x}" y="${y(v)}" width="${bwd}" height="3" fill="#7fe0ee"/><text x="${x+bwd/2}" y="${y(v)-5}" text-anchor="middle" font-size="12" font-weight="700" fill="#e8f6ff">${v}</text><text x="${x+bwd/2}" y="${h-pb+16}" text-anchor="middle" font-size="11" fill="#8fa6c4">${c.labels[i]}</text>`});
  const pts=c.team.map((v,i)=>`${pl+i*bw+bw/2},${y(v)}`).join(' ');s+=`<polyline points="${pts}" fill="none" stroke="#e8eef7" stroke-width="2.5" stroke-dasharray="1 5" stroke-linecap="round"/>`;
  c.team.forEach((v,i)=>{s+=`<circle cx="${pl+i*bw+bw/2}" cy="${y(v)}" r="3.5" fill="#fff"/>`});
  s+=`<line x1="${pl}" x2="${w-pr}" y1="${y(c.target)}" y2="${y(c.target)}" stroke="#f2c14e" stroke-width="2" stroke-dasharray="7 4"/><text x="${w-pr}" y="${y(c.target)-5}" text-anchor="end" font-size="11" font-weight="700" fill="#f2c14e">Target ${c.target}</text>`;
  s+=`<text x="${pl}" y="15" font-size="12" fill="#cfe3ff" font-weight="700">${esc(c.metric)}</text><text x="${w-pr}" y="15" text-anchor="end" font-size="11" fill="#cfe3ff">▮ rep   ⋯ team average</text></svg>`;return s}
function table(c){const th=c.labels.map(l=>`<th>${l}</th>`).join('');const row=(lab,v,hl)=>`<tr${hl?' class="hl"':''}><td>${lab}</td>${v.map(x=>`<td>${x}</td>`).join('')}</tr>`;
  return `<table class="d"><tr><th></th>${th}</tr>${row(c.name+' · '+c.metric,c.vals,1)}${row('Team average',c.team)}${c.rows.map(r=>row(r[0],r[1])).join('')}</table>`}

/* ---- case panel ---- */
function openCase(id){const c=CASES.find(k=>k.id===id),s=state[id];
  const p=UI.open(`<div class="row"><div id="pt"></div><div style="flex:1;min-width:260px"><span class="chip">A1 · Spot the Pattern</span><h2>${c.name} <span class="mut small">· ${c.role} · ${c.tenure} at Lumera</span></h2>
   <div class="note small"><b>Context:</b> ${esc(c.note)}</div></div></div>
   ${chart(c)}${table(c)}
   <h3>1 · How would you classify this?</h3><div class="opts" id="o1">${Object.entries(CLS).map(([k,v])=>`<label class="opt"><input type="radio" name="cls" value="${k}"><span><b>${v}</b></span></label>`).join('')}</div>
   <h3>2 · Which detail decided it?</h3><div class="opts" id="o2">${c.det.map((d,i)=>`<label class="opt"><input type="radio" name="det" value="${i}"><span>${esc(d)}</span></label>`).join('')}</div>
   <div id="fb" aria-live="polite"></div>
   <div class="bar"><button class="btn ghost" id="bk">Back to the floor</button><button class="btn gold" id="sub" autofocus>Submit my answer</button></div>`,{closable:true,onClose:hud});
  $('#pt',p).appendChild(portrait(LOOK[id],4));
  const radios=[...p.querySelectorAll('input')];radios.forEach(r=>r.addEventListener('change',()=>{p.querySelectorAll('.opt').forEach(o=>o.classList.toggle('sel',o.querySelector('input').checked))}));
  $('#bk',p).onclick=()=>UI.close();
  const submit=$('#sub',p);
  function lock(){radios.forEach(r=>r.disabled=true)}
  if(s.status==='ok'){radios.find(r=>r.name==='cls'&&r.value===c.ans).checked=true;radios.find(r=>r.name==='det'&&+r.value===c.ok).checked=true;p.querySelectorAll('.opt').forEach(o=>o.classList.toggle('sel',o.querySelector('input').checked));lock();submit.style.display='none';
    $('#fb',p).innerHTML=`<div class="fb ok"><b class="t">Reviewed · ${CLS[c.ans]}</b>${esc(c.why)}</div>`;return}
  submit.onclick=()=>{const cl=(p.querySelector('input[name=cls]:checked')||{}).value,dt=(p.querySelector('input[name=det]:checked')||{}).value;
    const fb=$('#fb',p);if(!cl||dt===undefined){fb.innerHTML='<div class="fb hint"><b class="t">Choose both answers</b>Pick a classification and the detail that decided it.</div>';return}
    const okC=cl===c.ans,okD=+dt===c.ok;if(s.first===null)s.first=okC&&okD;
    if(okC&&okD){s.status='ok';fb.innerHTML=`<div class="fb ok"><b class="t">Right: ${CLS[c.ans]}</b>${esc(c.why)}</div>`;lock();submit.style.display='none';hud();
      if(done()===CASES.length){$('#bk',p).textContent='Back to the floor';const b=document.createElement('button');b.className='btn gold';b.textContent='All six reviewed: open the door →';b.onclick=()=>{UI.close();setTimeout(openDoor,50)};$('#bk',p).after(b);b.focus()}return}
    s.wrong++;p.querySelectorAll('.opt').forEach(o=>o.classList.remove('good','badc'));
    let msg=[];if(!okC)msg.push('Your classification doesn’t fit the evidence yet.');if(!okD)msg.push('The detail you chose isn’t what decides this case.');
    if(s.wrong>=2){radios.forEach(r=>{const good=(r.name==='cls'&&r.value===c.ans)||(r.name==='det'&&+r.value===c.ok);if(good)r.closest('.opt').classList.add('good')});
      fb.innerHTML=`<div class="fb no"><b class="t">Let’s walk through it</b>${esc(c.why)}<br><span class="mut small">The correct answers are highlighted. Select them and submit to mark this case as reviewed.</span></div>`}
    else fb.innerHTML=`<div class="fb hint"><b class="t">Not quite yet. Try again, as often as you like.</b>${msg.join(' ')} <span class="mut">Hint: ${esc(c.hint)}</span></div>`;
    hud()}}

/* ---- door / completion ---- */
function openDoor(){
  if(done()<CASES.length){UI.open(`<h2>The Case-File Room is locked</h2><p>Review all six scorecards to unlock it. You have done <b>${done()}</b> of ${CASES.length}.</p><div class="bar"><button class="btn gold" autofocus id="ok">Back to the floor</button></div>`);$('#ok').onclick=()=>UI.close();return}
  const first=CASES.filter(c=>state[c.id].first).length;
  UI.open(`<span class="chip">Level complete</span><h2>The door is open: Module 1 done</h2>
   <p>You read six scorecards and separated <b>sustained</b> underperformance from <b>isolated</b> issues and cases with <b>insufficient evidence</b>. You got <b>${first}</b> of 6 right on the first try, and unlimited retries are what make this a safe place to learn.</p>
   <table class="d"><tr><th>Rep</th><th>Classification</th><th>Deciding detail</th></tr>${CASES.map(c=>`<tr><td>${c.name} ${state[c.id].first?'✓':''}</td><td>${CLS[c.ans]}</td><td style="text-align:left">${esc(c.det[c.ok])}</td></tr>`).join('')}</table>
   <div class="note small"><b>What this practised (LO1):</b> identify indicators of underperformance and distinguish sustained from isolated issues. Three of the six were deliberately “insufficient evidence”, because new managers tend to over-diagnose.</div>
   <p class="mut small">Next in the course: <b>A2 · Case-File Analysis</b> (separate file), where the door leads.</p>
   <div class="bar"><button class="btn ghost" id="again">Replay this level</button><button class="btn gold" id="cl" autofocus>Close</button></div>`);
  $('#cl').onclick=()=>UI.close();$('#again').onclick=()=>location.reload()}

/* ---- list view (accessible route), help ---- */
function openList(){const p=UI.open(`<h2>Accessible list view</h2><p class="mut small">The same six cases without walking around. Everything is keyboard and screen-reader friendly.</p><div class="list">${CASES.map(c=>`<button class="btn ghost" data-id="${c.id}">${c.name} · ${c.role} — ${state[c.id].status==='ok'?'reviewed ✓':'to review'}</button>`).join('')}<button class="btn ghost" data-id="door">Case-File Room (${done()===CASES.length?'open':'locked'})</button></div><div class="bar"><button class="btn gold" id="x" autofocus>Close</button></div>`);
  p.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{const id=b.dataset.id;UI.close();setTimeout(()=>id==='door'?openDoor():openCase(id),30)});$('#x',p).onclick=()=>UI.close()}
function openHelp(){UI.open(`<h2>How to play</h2><p><b>Move:</b> WASD or arrow keys, or click/tap the floor. <b>Interact:</b> E, Space or Enter when the prompt appears (or click the character).</p><p><b>Goal:</b> walk up to each rep and review the scorecard. Decide whether it shows <b>sustained underperformance</b> (a pattern across several periods), an <b>isolated issue</b> (one data point with a known reason) or <b>insufficient evidence</b> (too little data or too small a sample to tell). Then name the detail that decided it.</p><p class="mut small">No scores are held against you. Try again as often as you like.</p><div class="bar"><button class="btn gold" id="x" autofocus>Got it</button></div>`);$('#x').onclick=()=>UI.close()}
$('#bl').onclick=openList;$('#bh').onclick=openHelp;
UI.open(`<span class="chip">Module 1 · Activity A1 · Learning outcome 1</span><h2 class="px" style="font-size:18px;line-height:1.5;margin:10px 0">SPOT THE PATTERN</h2>
 <p>It is the <b>start of Q4</b> at <b>Lumera Aesthetics</b>, which sells high-value aesthetic laser and body-contouring equipment. You are the new regional sales manager, and before your one-to-ones you want to know where each of your six reps really stands.</p>
 <p>Walk the sales floor, read each scorecard, and decide: <b>sustained underperformance</b>, an <b>isolated issue</b>, or <b>insufficient evidence</b>?</p>
 <div class="note small">Move with <b>WASD / arrows</b> or tap the floor. Press <b>E</b> next to a rep. Prefer not to walk around? Use <b>List view</b> at the top.</div>
 <div class="bar"><button class="btn ghost" id="st2">Start with list view</button><button class="btn gold" id="st" autofocus>Start</button></div>`,{closable:false});
$('#st').onclick=()=>UI.close();$('#st2').onclick=()=>{UI.close();setTimeout(openList,30)};

</script></body></html>
